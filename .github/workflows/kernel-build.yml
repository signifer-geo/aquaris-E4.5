name: kernel-build

on:
  push:
    branches: [ "aquaris-E4.5" ]
  pull_request:
    branches: [ "aquaris-E4.5" ]
  workflow_dispatch: {}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t aquaris-e45-kernel:ci .

      - name: Debug makeMtk.ini + projects
        run: |
          ls -la
          echo "---- projects ----"
          ls -1 mediatek/config | head -n 80

      - name: Build kernel (krillin)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquaris-e45-kernel:ci \
            bash -lc "./tools/build.sh krillin"

      - name: Build boot.img (kernel + Ubuntu Touch ramdisk)
        env:
          SHA: ${{ github.sha }}
        run: |
          docker run --rm \
            --user 0:0 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquaris-e45-kernel:ci \
            bash -lc '
              set -e
              apt-get update && apt-get install -y --no-install-recommends abootimg && rm -rf /var/lib/apt/lists/*

              SHA_SHORT="${SHA:0:7}"

              K=out/target/product/krillin/obj/KERNEL_OBJ/arch/arm/boot/zImage
              test -f "$K" || { echo "Missing kernel at $K"; exit 1; }

              test -f boot_template/bootimg.cfg || { echo "Missing boot_template/bootimg.cfg"; exit 1; }
              test -f boot_template/initrd.img  || { echo "Missing boot_template/initrd.img"; exit 1; }

              mkdir -p artifacts

              cp "$K" artifacts/zImage-krillin-${SHA_SHORT}

              abootimg --create artifacts/new_boot-krillin-${SHA_SHORT}.img \
                -f boot_template/bootimg.cfg \
                -k "$K" \
                -r boot_template/initrd.img

              echo "Built:"
              ls -lh artifacts/*

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # Grab common outputs if they exist. Don't fail if paths differ.
          find . -type f \( \
              -name "zImage" -o -name "Image" -o -name "Image.gz" -o -name "*.dtb" -o -name "*.ko" \
            \) -print -exec cp --parents -t artifacts {} \; || true

          # Always include build logs if present
          find . -maxdepth 4 -type f -name "*.log" -print -exec cp --parents -t artifacts {} \; || true

          # If nothing found, still keep a marker so upload step works
          if [ -z "$(ls -A artifacts)" ]; then
            echo "No artifacts auto-detected. Build may still be OK; adjust paths in workflow." > artifacts/README.txt
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aquaris-e4.5-kernel-artifacts
          path: artifacts

